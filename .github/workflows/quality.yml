name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/karaoke_test

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          ruby-version: '3.3.0'

      - name: Prepare database
        run: bin/rails db:prepare

      - name: Run full RSpec suite
        run: bundle exec rspec

      - name: Run RuboCop
        run: bundle exec rubocop

      - name: Run Brakeman
        # Rails lifecycle status is tracked separately; application security
        # warnings remain blocking.
        run: bundle exec brakeman -q -x EOLRails

      - name: Audit dependencies
        run: bundle exec bundle-audit check --update

      - name: Lint ERB templates
        run: bundle exec erb_lint app/views

      - name: Verify migrations are applied
        run: bin/rails db:abort_if_pending_migrations

      - name: Verify schema is clean
        run: |
          bin/rails db:schema:dump
          git diff --exit-code -- db/schema.rb

  deploy:
    name: Deploy to Heroku
    needs: quality
    if: >-
      needs.quality.result == 'success' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
      HEROKU_EMAIL: ${{ secrets.HEROKU_EMAIL }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node for Heroku CLI
        if: env.HEROKU_API_KEY != '' && env.HEROKU_EMAIL != ''
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Heroku CLI
        if: env.HEROKU_API_KEY != '' && env.HEROKU_EMAIL != ''
        run: npm install --global heroku

      - name: Authenticate with Heroku
        if: env.HEROKU_API_KEY != '' && env.HEROKU_EMAIL != ''
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: heroku auth:whoami

      - name: Deploy to Heroku
        if: env.HEROKU_API_KEY != '' && env.HEROKU_EMAIL != ''
        env:
          HEROKU_APP_NAME: peaceful-crag-96802
        # Heroku's Git ref may contain history from a prior deployment source;
        # deploy the verified GitHub commit explicitly, matching the previous
        # deploy action's force-deploy behavior.
        run: git push --force "https://git.heroku.com/${HEROKU_APP_NAME}.git" HEAD:main

      - name: Explain deployment skip
        if: env.HEROKU_API_KEY == '' || env.HEROKU_EMAIL == ''
        run: echo "Heroku deployment skipped because HEROKU_API_KEY and/or HEROKU_EMAIL is not configured."
